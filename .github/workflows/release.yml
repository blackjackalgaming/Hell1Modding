# Builds the loader and publishes it as a GitHub release.
#
# Users are never expected to build this themselves; they download the DLL
# attached here, or install it through a mod manager once the Thunderstore
# package exists. This workflow is the thing that makes that true.
#
# Versioning comes from the git tag, not from Thunderstore. Hell2Modding's
# nightly queries the Thunderstore API for its current published version and
# bumps the patch, which cannot work until a Hades 1 community exists - and
# tags are the better source anyway while we are pre-1.0.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.3.0)"
        required: true
        default: "0.3.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git.cmake stamps the sha and branch

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # x.y.z only - the sed patterns below and resources.rc's four-part
          # FILEVERSION both assume it.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$version' is not x.y.z" >&2
            exit 1
          fi

          echo "version=$version"                            >> "$GITHUB_OUTPUT"
          echo "version_comma=$(echo "$version" | tr '.' ','),0" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the source
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          vc="${{ steps.version.outputs.version_comma }}"

          sed -i 's/VERSION_NUMBER = "[^"]*"/VERSION_NUMBER = "'"$v"'"/'          src/version.hpp
          sed -i 's/^FILEVERSION.*/FILEVERSION     \t'"$vc"'/'                    src/resources.rc
          sed -i 's/^PRODUCTVERSION.*/PRODUCTVERSION     \t'"$vc"'/'              src/resources.rc
          sed -i 's/"FileVersion",      "[^"]*"/"FileVersion",      "'"$v"'"/'    src/resources.rc
          sed -i 's/"ProductVersion",   "[^"]*"/"ProductVersion",   "'"$v"'"/'    src/resources.rc

          grep -n 'VERSION_NUMBER' src/version.hpp
          grep -nE 'FILEVERSION|PRODUCTVERSION|Version",' src/resources.rc

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # lovely-lib is a Rust staticlib and its rust-toolchain.toml pins
      # nightly. Without this the CMake configure fails at corrosion.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # ~12 dependencies come in through FetchContent. Caching the populated
      # trees turns a cold 20-minute configure into a warm one.
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake_scripts/*.cmake', 'CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      # The Visual Studio generator on purpose: it is what the project is
      # actually built and tested with. Ninja is faster but untried here, and
      # a release build is the wrong place to find out.
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DFINAL=YES

      - name: Build
        run: cmake --build build --config RelWithDebInfo --target Hell1Modding

      - name: Stage the artifact
        shell: bash
        run: |
          mkdir -p dist
          # The trailing underscore exists so the build tree never holds
          # something Windows might load by accident. Drop it on the way out.
          cp build/RelWithDebInfo/d3d11_.dll dist/d3d11.dll
          cp build/RelWithDebInfo/d3d11_.pdb dist/d3d11.pdb || true
          cd dist && sha256sum d3d11.dll | tee d3d11.dll.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hell1Modding-${{ steps.version.outputs.version }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hell1Modding ${{ steps.version.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dist/d3d11.dll
            dist/d3d11.pdb
            dist/d3d11.dll.sha256
          body: |
            ## Installing

            1. Download `d3d11.dll` below.
            2. Drop it into the **`x64`** folder of your Hades install, next to `Hades.exe`
               (`steamapps/common/Hades/x64`) — not the folder above it.
            3. Launch the game. A `ReturnOfModding` folder appears next to `Hades.exe`,
               and a welcome window explains the rest.

            Mods go in `x64/ReturnOfModding/plugins`, one folder per mod.

            To uninstall, delete `d3d11.dll`. Nothing else in the game folder is modified.

            **Use the DirectX 11 build.** Hades picks its renderer by which executable you
            launch — `x64/Hades.exe` is DirectX 11 and `x64Vk/Hades.exe` is Vulkan. The
            Vulkan build never loads `d3d11.dll`, so the loader silently will not run.

            `d3d11.pdb` is optional. Put it next to `d3d11.dll` if you are reporting a
            crash - without it the loader's own frames in a crash log are bare addresses
            instead of function names.

  # Dormant until Thunderstore opens a Hades 1 community.
  #
  # Skipped unless BOTH are configured, so it costs nothing and cannot fail the
  # release while we wait:
  #   - repository variable THUNDERSTORE_COMMUNITY  (the community slug)
  #   - repository secret   TCLI_AUTH_TOKEN         (a Thunderstore service key)
  #
  # Publishes as-is; Thunderstore has no draft state, so review the GitHub
  # draft release first and only then let this run.
  publish-thunderstore:
    runs-on: ubuntu-latest
    name: Publish to Thunderstore
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check whether publishing is configured
        id: gate
        env:
          TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
          COMMUNITY: ${{ vars.THUNDERSTORE_COMMUNITY }}
        shell: bash
        run: |
          if [ -n "$TOKEN" ] && [ -n "$COMMUNITY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: THUNDERSTORE_COMMUNITY and/or TCLI_AUTH_TOKEN are not set."
            echo "There is no Hades 1 community on Thunderstore yet, so this is expected."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - name: Download the built DLL
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Hell1Modding-${{ needs.build.outputs.version }}
          path: dist

      - name: Install tcli
        if: steps.gate.outputs.ready == 'true'
        run: dotnet tool install --global tcli

      - name: Stamp version and community
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          cd thunderstore
          sed -i 's/versionNumber = "[^"]*"/versionNumber = "${{ needs.build.outputs.version }}"/' thunderstore.toml
          sed -i 's/communities = \[.*\]/communities = ["${{ vars.THUNDERSTORE_COMMUNITY }}"]/' thunderstore.toml
          cat thunderstore.toml

      - name: Publish
        if: steps.gate.outputs.ready == 'true'
        run: |
          cd thunderstore
          tcli publish --token ${{ secrets.TCLI_AUTH_TOKEN }}
