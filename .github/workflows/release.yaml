# Builds the loader on every push to main and attaches the DLL as a run
# artifact. This is CI, not a release: it exists so a broken build is caught
# on push rather than discovered later.
#
# Publishing a GitHub release is kept, but only on manual dispatch - cutting a
# release on every push to main would be noise.
#
# Everything Thunderstore is commented out. There is no Hades 1 community on
# Thunderstore yet, so nothing here pulls from or pushes to it.

name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish a draft GitHub release"
        type: boolean
        required: false
        default: false
      version:
        description: "0.3.0"
        required: true
        type: string

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git.cmake can stamp the sha and branch once it is
          # added back to the build. Harmless until then.
          fetch-depth: 0
          ref: ${{ github.event.inputs.version }}

      - name: Display inputs
        run: | 
          echo "Version: $VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            # No tag on a branch push. Use a dev version plus the short sha so
            # artifacts from different commits are distinguishable.
            version="0.3.0-dev+$(git rev-parse --short HEAD)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # Only for a real x.y.z, which in practice means a manual dispatch. A
      # push to main produces "0.1.0-dev+<sha>", which resources.rc's
      # four-component FILEVERSION cannot express - those builds keep whatever
      # version.hpp holds, which is correct for a dev artifact.
      #
      # (An earlier version of this file disabled this on the grounds that
      # "neither file exists in this project yet". Both do - src/version.hpp
      # and src/resources.rc - and git.cmake is included from CMakeLists.txt
      # at line 42. The seds below were dry-run against both files.)
      - name: Stamp the version into the source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"

          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$v' is not x.y.z; leaving the source alone."
            exit 0
          fi

          vc="$(echo "$v" | tr '.' ','),0"

          sed -i 's/VERSION_NUMBER = "[^"]*"/VERSION_NUMBER = "'"$v"'"/'       src/version.hpp
          sed -i 's/^FILEVERSION.*/FILEVERSION     \t'"$vc"'/'                 src/resources.rc
          sed -i 's/^PRODUCTVERSION.*/PRODUCTVERSION     \t'"$vc"'/'           src/resources.rc
          sed -i 's/"FileVersion",      "[^"]*"/"FileVersion",      "'"$v"'"/' src/resources.rc
          sed -i 's/"ProductVersion",   "[^"]*"/"ProductVersion",   "'"$v"'"/' src/resources.rc

          grep -n 'VERSION_NUMBER' src/version.hpp
          grep -nE 'FILEVERSION|PRODUCTVERSION' src/resources.rc

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Required, not optional. cmake_scripts/lovely.cmake is included from
      # CMakeLists.txt and calls corrosion_import_crate, so the configure step
      # runs cargo whether or not this job expects it to.
      #
      # lovely-lib's rust-toolchain.toml pins nightly, so stable is not enough.
      # (An earlier version of this file disabled these steps on the grounds
      # that "lovely was dropped from CMakeLists.txt - nothing in this build
      # touches cargo". Both halves are false: lovely is in the build, and it
      # patches the text of the game's own scripts, which is unrelated to how
      # ScriptManager::Load finds a mod.)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # About a dozen dependencies arrive via FetchContent. Caching the
      # populated trees turns a cold ~5 minute configure into a warm one.
      # Keyed on the cmake scripts, so any dependency change invalidates it.
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake_scripts/*.cmake', 'CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      # No explicit generator: windows-latest moves between VS versions, and
      # letting CMake pick whatever is installed avoids breaking on that.
      #
      # FINAL turns on /GL /Gy /Gw and /LTCG /OPT:ICF,REF. It has been built
      # locally against this source - the resulting DLL is 8.6 MB against
      # 19 MB without it, because whole-program optimisation folds identical
      # functions and drops unreferenced code. An earlier comment here said it
      # had "never been built with locally", which is no longer true.
      - name: Configure
        run: cmake -B build -A x64 -DFINAL=YES

      - name: Build
        run: cmake --build build --config RelWithDebInfo --target Hell1Modding

      - name: Stage the artifact
        shell: bash
        run: |
          mkdir -p dist
          # The trailing underscore exists so the build tree never holds
          # something Windows might load by accident. Drop it on the way out.
          cp build/RelWithDebInfo/d3d11_.dll dist/d3d11.dll
          cp build/RelWithDebInfo/d3d11_.pdb dist/d3d11.pdb || true
          cd dist && sha256sum d3d11.dll | tee d3d11.dll.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hell1Modding-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14

      # Manual only. A release per push to main would be noise.
      - name: Publish draft release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hell1Modding ${{ steps.version.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dist/d3d11.dll
            dist/d3d11.pdb
            dist/d3d11.dll.sha256
          body: |
            ## Installing

            1. Download `d3d11.dll` below.
            2. Drop it into the **`x64`** folder of your Hades install, next to `Hades.exe`
               (`steamapps/common/Hades/x64`) — not the folder above it.
            3. Launch the game. A `ReturnOfModding` folder appears next to `Hades.exe`.

            Mods go in `x64/ReturnOfModding/plugins`, one folder per mod.

            To uninstall, delete `d3d11.dll`. Nothing else in the game folder is modified.

            **Use the DirectX 11 build.** Hades picks its renderer by which executable you
            launch — `x64/Hades.exe` is DirectX 11 and `x64Vk/Hades.exe` is Vulkan. The
            Vulkan build never loads `d3d11.dll`, so the loader silently will not run.

            `d3d11.pdb` is optional. Put it next to `d3d11.dll` if you are reporting a
            crash — without it the loader's own frames in a crash log are bare addresses
            instead of function names.

